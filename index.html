<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splendor Duel Automa</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #d4af37;
      --border-color: #333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Bar Header */
    .header-bar {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .header-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-color);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-stats {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: #aaa;
    }

    /* Main Automa Card */
    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    /* Card Section Rows */
    .card-section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .card-section:last-child {
      border-bottom: none;
    }

    .card-section.black-bar {
      background-color: #000000;
      color: #ffffff;
    }

    /* Crown Prefix Container */
    .crown-prefix {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      color: #ffd700;
      margin-right: 8px;
    }

    .crown-icon {
      width: 18px;
      height: 18px;
      fill: #ffd700;
    }

    /* Action Badges Bar */
    .actions-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Vertical Rectangular Badges */
    .badge-rect {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 8px;
      min-width: 36px;
      min-height: 42px;
      gap: 2px;
    }

    .black-bar .badge-rect {
      background: #222;
      border-color: #555;
    }

    .badge-rect svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .badge-rect .round-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* CFX Tags */
    .cfx-tag {
      font-size: 0.65rem;
      font-weight: 600;
      color: #ff9800;
      margin-left: 4px;
      opacity: 0.85;
    }

    /* Card Footer Info */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: #141414;
      font-size: 0.8rem;
      color: #777;
    }

    .card-number {
      font-weight: 700;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Header Bar -->
  <div class="header-bar">
    <div id="headerTitle" class="header-title">Splendor Duel Automa</div>
    <div class="header-stats">
      <span>Round <strong id="roundDisplay">1</strong></span>
      <span>Cards Left: <strong id="cardsLeftDisplay">10</strong></span>
    </div>
  </div>

  <!-- Main Card Display -->
  <div class="card">
    <!-- Top Black Bar Section -->
    <div class="card-section black-bar">
      <div class="actions-left">
        <!-- Crown Prefix -->
        <div class="crown-prefix">
          <svg class="crown-icon" viewBox="0 0 24 24">
            <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
          </svg>
          :
        </div>

        <!-- Vertical Rectangular Action Icons -->
        <!-- Steal (Pinch Icon) -->
        <div class="badge-rect" title="Steal">
          <svg viewBox="0 0 24 24">
            <path d="M9 3a2 2 0 0 0-2 2v6.67l-1.22-1.22a2 2 0 0 0-2.83 0 2 2 0 0 0 0 2.83l4.34 4.34a8 8 0 0 0 5.66 2.38h3.05a8 8 0 0 0 8-8V9a2 2 0 0 0-2-2 2 2 0 0 0-2 2v1h-1V7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2h-1V5a2 2 0 0 0-2-2z"/>
          </svg>
          <span class="round-num">#1</span>
        </div>

        <!-- Privilege (Folded Newspaper Icon) -->
        <div class="badge-rect" title="Privilege">
          <svg viewBox="0 0 24 24">
            <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-1 13H5V7h14v11zM6 11h7v2H6zm0 4h7v2H6zm8-4h4v6h-4z"/>
          </svg>
          <span class="round-num">#2</span>
        </div>
      </div>

      <!-- Optional CFX Tag -->
      <span class="cfx-tag">[CFX]</span>
    </div>

    <!-- Additional Card Content Sections Go Here -->
    <div class="card-section">
      <span>Primary Action</span>
      <span class="round-num">#1</span>
    </div>

    <!-- Card Footer -->
    <div class="card-footer">
      <span>Automa Card</span>
      <!-- Plain card number without '#' -->
      <span class="card-number" id="cardNumberDisplay">12</span>
    </div>
  </div>
</div>

<script>
  // Dynamic Title Update Handler
  function updateHeaderTitle(hasCounterfeitersExpansion) {
    const titleElement = document.getElementById('headerTitle');
    if (hasCounterfeitersExpansion) {
      titleElement.textContent = "Splendor Duel with the Counterfeiters expansion Automa";
    } else {
      titleElement.textContent = "Splendor Duel Automa";
    }
  }

  // Example call (set to true to enable expansion title)
  updateHeaderTitle(false);
</script>

</body>
</html>
